# Hosted execution cycle (GC-009): applying the `groundcrew` label to an issue
# whose body is a mission file runs the mission with Claude and opens a pull
# request. The contract is checked before any token is spent.
name: Mission

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: mission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.label.name == 'groundcrew'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      mission_id: ${{ steps.plan.outputs.mission_id }}
      title: ${{ steps.plan.outputs.title }}
      mission_path: ${{ steps.plan.outputs.mission_path }}
      branch: ${{ steps.plan.outputs.branch }}
      max_turns: ${{ steps.plan.outputs.max_turns }}
      max_cost_usd: ${{ steps.plan.outputs.max_cost_usd }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: plan
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: node scripts/missions/issue-cli.mts plan --comment-file "$RUNNER_TEMP/comment.md"
      - name: Explain why the mission did not run
        if: steps.plan.outputs.action != 'run'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  run:
    needs: plan
    if: needs.plan.outputs.action == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      BRANCH: ${{ needs.plan.outputs.branch }}
      MISSION_PATH: ${{ needs.plan.outputs.mission_path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Put the mission on its branch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          HAS_KEY: "true"
        run: |
          git checkout -b "$BRANCH"
          node scripts/missions/issue-cli.mts plan --write > /dev/null
      - name: Run the mission with Claude
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the hosted agent of Groundcrew. Carry out mission ${{ needs.plan.outputs.mission_id }}
            ("${{ needs.plan.outputs.title }}"), requested in issue #${{ github.event.issue.number }} of ${{ github.repository }}.

            1. Read AGENTS.md and follow every rule in it. Then read the mission file at ${{ needs.plan.outputs.mission_path }}.
               The mission file is the contract: stay inside scope.authorized, respect limits.rules, and do not edit the file.
            2. You are already on branch ${{ needs.plan.outputs.branch }}. Work only on this branch; never push to main.
            3. Implement the mission with tests for each acceptance criterion. Before committing, run
               npm run lint, npm run typecheck, npm test and npm run missions:check, and fix what fails.
               You cannot run the e2e and db jobs here; CI runs them on the pull request.
            4. Commit your work together with the mission file, push the branch with
               git push -u origin ${{ needs.plan.outputs.branch }}, then open the pull request with
               gh pr create --base main --head ${{ needs.plan.outputs.branch }} --title "${{ needs.plan.outputs.mission_id }}: ${{ needs.plan.outputs.title }}" --body-file <report>
               where <report> is a file holding the report in the format AGENTS.md defines, ending with "Refs #${{ github.event.issue.number }}".
            5. If the mission's escalation conditions apply, or you cannot finish within scope, stop, push what you have,
               open the pull request anyway and say in the report what is missing and why.
          claude_args: >-
            --max-turns ${{ needs.plan.outputs.max_turns }}
            --max-budget-usd ${{ needs.plan.outputs.max_cost_usd }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin ${{ needs.plan.outputs.branch }}),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(ls:*),Bash(mkdir:*)"
      - name: Find the pull request
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Record cost, turns and duration on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          MISSION_ID: ${{ needs.plan.outputs.mission_id }}
          MAX_TURNS: ${{ needs.plan.outputs.max_turns }}
          MAX_COST: ${{ needs.plan.outputs.max_cost_usd }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          node scripts/missions/issue-cli.mts report \
            --mission-id "$MISSION_ID" --max-turns "$MAX_TURNS" --max-cost "$MAX_COST" \
            --execution-file "$EXECUTION_FILE" --pr-url "$PR_URL" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/report.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
